[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchcheck"
version = "0.1.0"
description = "Evidence-based, isolated C/C++ security patch validation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
patchcheck = "patchcheck.cli:main"

[tool.setuptools]
packages = ["patchcheck"]

