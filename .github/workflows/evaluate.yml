# Continuous evaluation of the full 9-scenario matrix.
#
# The pipeline is target-agnostic, exactly like the tool: adding a new C/C++
# program means adding configs/<name>-{correct,incomplete,regression}.json
# (plus its pinned sources and test inputs) -- this workflow needs no change.
#
# What each run does:
#   1. restores the durable per-scenario regression suites from the Actions
#      cache, so minimized reproducers generated by one run are genuinely
#      re-executed by the next (spec section 3.3 round-trip across CI jobs);
#   2. builds the toolchain image used by the docker sandbox fallback;
#   3. probes which sandbox envelope the runner actually permits;
#   4. runs scripts/evaluate.py (it restores nested git histories itself),
#      which gates the job on the scenario contract: exit 1 on any mismatch;
#   5. publishes evaluation.html + raw evidence as workflow artifacts and
#      writes a markdown summary table to the job summary.

name: evaluate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      backend:
        description: "Sandbox backend"
        type: choice
        options: [auto, namespace, docker, restricted]
        default: auto
      targets:
        description: "Space-separated targets (empty = all three)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: evaluate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      BACKEND: ${{ inputs.backend || 'auto' }}
      TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore durable regression suites
        uses: actions/cache@v4
        with:
          path: .patchcheck-suites
          key: patchcheck-suites-${{ runner.os }}-v1
          restore-keys: patchcheck-suites-${{ runner.os }}-

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils git

      - name: Build toolchain image (docker sandbox fallback)
        run: docker build --platform=linux/amd64 -t patchcheck-toolchain:1 docker/

      - name: Probe sandbox envelope on this runner
        run: python3 scripts/probe_sandbox.py || echo "::warning::sandbox probe failed; evaluation will fall back to restricted mode"

      - name: Run the evaluation matrix
        run: |
          ARGS=(--backend "$BACKEND" --output "artifacts/evaluation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ -n "$TARGETS" ]; then ARGS+=(--targets $TARGETS); fi
          python3 scripts/evaluate.py "${ARGS[@]}"

      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          outputs = sorted(pathlib.Path("artifacts").glob("evaluation-*/evaluation.json"))
          if not outputs:
              print("No evaluation.json was produced -- the run failed before any scenario executed.")
              raise SystemExit(0)
          rows = json.loads(outputs[-1].read_text(encoding="utf-8"))
          print("## Evaluation results\n")
          print("| Scenario | Expected | Actual | Result | Generated re-executions |")
          print("|---|---|---|---|---|")
          for r in rows:
              verdict = "OK" if r["passed"] else "FAILED"
              print(f"| {r['scenario']} | {r['expected_exit']} | {r['actual_exit']} "
                    f"| {verdict} | {r['generated_executions']} |")
          print(f"\nFull browser-readable report: artifact `evaluation-evidence` "
                f"(open `evaluation.html`), produced by `{outputs[-1].parent}`.")
          PY

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-evidence
          path: artifacts/
          retention-days: 30
